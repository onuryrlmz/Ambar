[package]
name = "ambar"
version = "0.1.0"
description = "Arşiv yöneticisi"
authors = ["onuryrlmz"]
edition = "2021"

[lib]
name = "ambar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"
unicode-normalization = "0.1"
unrar-ng = "0.7"
unrar-ng-sys = "0.7"
zip = { version = "9", default-features = false, features = ["aes-crypto", "deflate", "bzip2", "zstd"] }
oem_cp = "2"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["aes256", "bzip2", "ppmd", "deflate"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
liblzma = { version = "0.4", features = ["static"] }
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
tempfile = "3"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["aes256", "compress"] }

[profile.release]
# A panic on hostile archive data is caught by the job layer; never abort.
panic = "unwind"
