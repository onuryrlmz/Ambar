[package]
name = "ambar"
version = "0.1.0"
description = "Arşiv yöneticisi"
authors = ["onuryrlmz"]
edition = "2021"

[lib]
name = "ambar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"
unicode-normalization = "0.1"
unrar-ng = "0.7"
unrar-ng-sys = "0.7"

[dev-dependencies]
tempfile = "3"
